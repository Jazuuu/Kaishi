# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: "My 6ADET final project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Progress persistence (shared_preferences,
  # key "user_progress")
  shared_preferences: ^2.2.3
  # AI Learning Assistant, powered by Gemini 
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.1.0
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/lessons.json
    - assets/data/word_of_the_day.json
    - .env
